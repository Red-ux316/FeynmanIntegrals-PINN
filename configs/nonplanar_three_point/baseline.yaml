data:
  problem: nonplanar_three_point
  domain: [-20.0, -0.1]
  datasets:
    boundary:
      sampler: boundary
      n: 2
    validation:
      sampler: uniform
      n: 1000
      seed: 1
    test:
      sampler: uniform
      n: 10000
      seed: 2

dtype: float64

model:
  name: mlp
  hidden: [128, 128, 128, 128]
  activation: gelu

physics:
  system: nonplanar_three_point
  input_scale: 1

balancing:
  name: relobralo
  temperature: 1.0
  alpha: 0.99
  expected_rho: 0.999
  history: paper

collocation:
  name: resample
  n_per_epoch: 65536
  batch_size: 128

training:
  epochs: 400
  seed: 0
  threads: 1
  log_every: 10
  checkpoint_every: 10
  residual_stats_points: 1024
  validation_physics: true
  device: auto
  optimizer:
    name: adam
    lr: 1.0e-3
  scheduler:
    name: reduce_on_plateau
    factor: 0.5
    patience: 10
    cooldown: 10
    min_lr: 1.0e-15
