data:
  problem: sunrise_equal_mass
  domain:
  - -10.0
  - -1.0
  datasets:
    boundary:
      sampler: boundary
      n: 2
    validation:
      sampler: uniform
      n: 1000
      seed: 1
    test:
      sampler: uniform
      n: 10000
      seed: 2
dtype: float64
model:
  name: mlp
  hidden:
  - 64
  - 64
  - 64
  activation: gelu
physics:
  system: sunrise_equal_mass_bu
  input_scale: 1
balancing:
  name: relobralo
  temperature: 0.5
  alpha: 0.99
  expected_rho: 0.999
  history: paper
collocation:
  name: resample
  n_per_epoch: 65536
  batch_size: 128
training:
  epochs: 400
  seed: 0
  threads: 1
  log_every: 10
  checkpoint_every: 10
  residual_stats_points: 1024
  validation_physics: true
  device: auto
  optimizer:
    name: adam
    lr: 0.001
  scheduler:
    name: reduce_on_plateau
    factor: 0.5
    patience: 10
    cooldown: 10
    min_lr: 1.0e-15
